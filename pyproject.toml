[project]
name = "intranet-dashboard"
version = "0.1.0"
description = "Home lab service dashboard with live health checks"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
