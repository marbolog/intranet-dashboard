dashboard:
  title: Home Lab
  port: 8888

hosts:
  - name: Raspberry Pi 5
    ip: 192.168.50.13
    services:
      - name: PiGallery2
        url: http://192.168.50.13:3010/
        description: Self-hosted photo gallery

      - name: qBittorrent
        url: http://192.168.50.13:8080/
        description: BitTorrent client web UI

      - name: TG Downloader
        url: http://192.168.50.13:8090/
        description: Telegram channel media downloader and file browser

      - name: Jellyfin
        url: http://192.168.50.13:8096/
        description: Media server — movies, TV shows, music

      - name: RSS Media Review
        url: http://192.168.50.13:8765/
        description: Keep/discard review UI for RSS feed downloads

      - name: Static Files
        url: http://192.168.50.13/
        description: nginx static file server — serves /srv/www (autoindex on)

      - name: TG Listener
        description: Background Telegram media download listener (Docker)
        docker_container: tg-downloader

      - name: RSS Feed Reader
        description: Hourly RSS feed poller (cron job — no persistent process)

      - name: Power Monitor
        description: Power outage and under-voltage notifier
        systemd_unit: power-monitor.service

      - name: Reverse Tunnel
        description: SSH reverse tunnel to relay VPS
        systemd_unit: reverse-tunnel.service

      - name: Ollama
        description: Local LLM inference server (mistral:7b, phi3:mini) — bound to 127.0.0.1:11434
        systemd_unit: ollama.service

      - name: Samba File Share
        description: SMB/CIFS network file sharing (ports 445/139)
        systemd_unit: smbd.service

      - name: Tailscale
        description: WireGuard mesh VPN node agent
        systemd_unit: tailscaled.service

  - name: Torrent Stack
    ip: 192.168.50.13
    services:
      - name: Prowlarr
        url: http://192.168.50.13:9696/
        description: Indexer manager — aggregates torrent and Usenet sources

      - name: autobrr
        url: http://192.168.50.13:7474/
        description: Automated torrent downloader — filter rules and IRC announce

      - name: Transmission
        url: http://192.168.50.13:9091/transmission/web/
        description: BitTorrent client web UI

  - name: Magnetize Stack
    ip: 192.168.50.13
    services:
      - name: bitmagnet
        url: http://192.168.50.13:3333/
        description: Self-hosted DHT torrent indexer and search (crawls the BitTorrent DHT)

      - name: Jackett
        url: http://192.168.50.13:9118/
        description: Torrent indexer proxy (Torznab/Cardigann) feeding the stack

      - name: FlareSolverr
        description: Cloudflare challenge solver proxy for indexers (Docker, no UI)
        docker_container: mgzns-flaresolverr

      - name: bitmagnet Postgres
        description: PostgreSQL backend for bitmagnet (Docker, internal)
        docker_container: mgzns-bitmagnet-postgres

  - name: Zimaboard 2
    ip: 192.168.50.12
    services:
      - name: ZimaOS
        url: http://192.168.50.12/
        description: Home server OS and app store

      - name: ttyd
        url: http://192.168.50.12:7681/
        description: Web-based terminal

      - name: MiniDLNA
        url: http://192.168.50.12:8200/
        description: DLNA media server
